name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test --watchAll=false --ci

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Create backend .env
        run: |
          echo "MONGO_URL=mongodb://localhost:27017" > backend/.env
          echo "DB_NAME=test_database" >> backend/.env

      - name: Start backend server
        run: |
          cd backend && uvicorn server:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8001/docs 2>/dev/null && break || sleep 1
          done

      - name: Run integration tests
        run: python backend_test.py
