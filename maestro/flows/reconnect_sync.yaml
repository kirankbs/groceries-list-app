# appId for Expo Go (development). Replace with actual bundle ID for standalone builds.
appId: host.exp.Exponent
---
# Assumes check_item_offline.yaml ran immediately before this flow,
# leaving airplane mode on with at least 1 pending sync operation.

# Re-enable network connectivity
- toggleAirplaneMode

# On reconnect, the app detects wasOffline=true and calls syncQueue.flush().
# During the flush the banner label switches to "Syncing…"
- assertVisible:
    text: "Syncing"

# After flush completes the sync queue is empty.
# The banner shows 0 pending and eventually disappears (syncStatusLabel returns null).
# Wait for the "pending" text to vanish — this confirms all queued ops reached the server.
- assertNotVisible:
    text: "pending"

# Once all pending ops are synced and the device is back online the offline banner
# is no longer rendered (syncStatusLabel is null → the View is not mounted).
- assertNotVisible:
    text: "Offline"
